<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" role="img" aria-label="CRT monitor booting: whoami — Guilherme, Information Systems student at UFSM; interests: C, low-level, cybersecurity, networking, Python; status: open to work">
  <defs>
    <filter id="glow-h" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.2" result="b1"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="6" result="b2"/>
      <feMerge><feMergeNode in="b2"/><feMergeNode in="b1"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="scan-h" width="4" height="3" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#000" fill-opacity="0.45"/>
    </pattern>
    <linearGradient id="bezel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#232a35"/><stop offset="0.5" stop-color="#151a22"/><stop offset="1" stop-color="#0c0f14"/>
    </linearGradient>
    <radialGradient id="screen" cx="50%" cy="45%" r="70%">
      <stop offset="0" stop-color="#06182e"/><stop offset="0.6" stop-color="#030b18"/><stop offset="1" stop-color="#02040a"/>
    </radialGradient>
    <radialGradient id="vignette" cx="50%" cy="50%" r="72%">
      <stop offset="0.55" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity="0.85"/>
    </radialGradient>
    <linearGradient id="roll" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#00e5ff" stop-opacity="0"/><stop offset="0.5" stop-color="#00e5ff" stop-opacity="0.07"/><stop offset="1" stop-color="#00e5ff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.07"/><stop offset="0.35" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="screenclip"><rect x="40" y="30" width="820" height="300" rx="26"/></clipPath>
    <clipPath id="c1"><rect x="70" y="84" height="30" width="0"><animate attributeName="width" values="216.0;226.8;237.6;248.4;259.2;270.0;280.8;900.0" calcMode="discrete" begin="1.10s" dur="0.39s" fill="freeze"/></rect></clipPath><clipPath id="c3"><rect x="70" y="144" height="30" width="0"><animate attributeName="width" values="216.0;226.8;237.6;248.4;259.2;270.0;280.8;291.6;302.4;313.2;324.0;334.8;345.6;356.4;367.2;378.0;388.8;399.6;900.0" calcMode="discrete" begin="2.24s" dur="0.99s" fill="freeze"/></rect></clipPath><clipPath id="c5"><rect x="70" y="204" height="30" width="0"><animate attributeName="width" values="216.0;226.8;237.6;248.4;259.2;270.0;280.8;291.6;302.4;313.2;324.0;334.8;345.6;356.4;367.2;378.0;900.0" calcMode="discrete" begin="3.98s" dur="0.88s" fill="freeze"/></rect></clipPath>
  </defs>
  <style>
    .flicker { animation: flicker 7s infinite; }
    @keyframes flicker { 0%, 88%, 92%, 100% { opacity: 1 } 89% { opacity: .82 } 90% { opacity: .97 } 91% { opacity: .88 } }
    .roll { animation: roll 6s linear infinite; }
    @keyframes roll { from { transform: translateY(-120px) } to { transform: translateY(340px) } }
    .led { animation: led 3s ease-in-out infinite; }
    @keyframes led { 50% { opacity: .55 } }
    @media (prefers-reduced-motion: reduce) { .flicker, .roll, .led { animation: none } }
  </style>

  <rect width="900" height="400" rx="30" fill="url(#bezel)"/>
  <rect x="2" y="2" width="896" height="396" rx="28" fill="none" stroke="#2c3542" stroke-width="2"/>
  <rect x="30" y="20" width="840" height="320" rx="32" fill="#05070b"/>

  <g clip-path="url(#screenclip)">
    <rect x="40" y="30" width="820" height="300" fill="url(#screen)"/>
    <g class="flicker" font-family="ui-monospace, 'SFMono-Regular', 'DejaVu Sans Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="18" filter="url(#glow-h)" xml:space="preserve">
            <text x="72" y="76" fill="#2a86c4" opacity="0">GUIGALMESH BIOS v2.6 :: phosphor CRT-9000 :: memory 640K OK<set attributeName="opacity" to="1" begin="0.40s" fill="freeze"/></text>
      <text x="72" y="106" clip-path="url(#c1)"><tspan fill="#2a86c4">guest@guigalmesh:~$ </tspan><tspan fill="#00e5ff">whoami</tspan></text>
      <text x="72" y="136" fill="#3db8ff" opacity="0">Guilherme · Information Systems student @ UFSM<set attributeName="opacity" to="1" begin="1.79s" fill="freeze"/></text>
      <text x="72" y="166" clip-path="url(#c3)"><tspan fill="#2a86c4">guest@guigalmesh:~$ </tspan><tspan fill="#00e5ff">cat interests.txt</tspan></text>
      <text x="72" y="196" fill="#3db8ff" opacity="0">[C] [low-level] [cybersecurity] [networking] [python]<set attributeName="opacity" to="1" begin="3.53s" fill="freeze"/></text>
      <text x="72" y="226" clip-path="url(#c5)"><tspan fill="#2a86c4">guest@guigalmesh:~$ </tspan><tspan fill="#00e5ff">status --career</tspan></text>
      <text x="72" y="256" fill="#3db8ff" opacity="0">▶ OPEN TO WORK — looking for my first opportunity in tech<set attributeName="opacity" to="1" begin="5.16s" fill="freeze"/></text>
      <g opacity="0"><set attributeName="opacity" to="1" begin="5.61s" fill="freeze"/><text x="72" y="286" fill="#2a86c4">guest@guigalmesh:~$ </text><rect x="290.0" y="270" width="11" height="20" fill="#00e5ff"><animate attributeName="opacity" values="1;0" dur="1.05s" calcMode="discrete" repeatCount="indefinite"/></rect></g>
    </g>
    <rect class="roll" x="40" y="30" width="820" height="80" fill="url(#roll)"/>
    <rect x="40" y="30" width="820" height="300" fill="url(#scan-h)"/>
    <rect x="40" y="30" width="820" height="300" fill="url(#vignette)"/>
    <rect x="40" y="30" width="820" height="300" fill="url(#shine)"/>
  </g>

  <text x="60" y="371" font-family="ui-monospace, 'SFMono-Regular', 'DejaVu Sans Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" letter-spacing="4" fill="#5b6778">GUIGALMESH · CRT-9000</text>
  <rect x="620" y="356" width="8" height="18" rx="2" fill="#0a0d12"/><rect x="634" y="356" width="8" height="18" rx="2" fill="#0a0d12"/><rect x="648" y="356" width="8" height="18" rx="2" fill="#0a0d12"/><rect x="662" y="356" width="8" height="18" rx="2" fill="#0a0d12"/><rect x="676" y="356" width="8" height="18" rx="2" fill="#0a0d12"/><rect x="690" y="356" width="8" height="18" rx="2" fill="#0a0d12"/><rect x="704" y="356" width="8" height="18" rx="2" fill="#0a0d12"/><rect x="718" y="356" width="8" height="18" rx="2" fill="#0a0d12"/><rect x="732" y="356" width="8" height="18" rx="2" fill="#0a0d12"/><rect x="746" y="356" width="8" height="18" rx="2" fill="#0a0d12"/><rect x="760" y="356" width="8" height="18" rx="2" fill="#0a0d12"/><rect x="774" y="356" width="8" height="18" rx="2" fill="#0a0d12"/>
  <circle class="led" cx="820" cy="365" r="6" fill="#00e5ff" filter="url(#glow-h)"/>
  <circle cx="850" cy="365" r="9" fill="#0a0d12" stroke="#2c3542"/>
</svg>
